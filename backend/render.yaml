services:
  - type: web
    name: ine-price-tracker-backend
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm install && npx playwright install chromium --with-deps
    startCommand: node src/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: SENDGRID_FROM_EMAIL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: STORE_BASE_URL
        value: https://demo.inelabteamdev.com
      - key: SCRAPER_HEADLESS
        value: "true"
      - key: SCRAPER_TIMEOUT_MS
        value: "30000"
      - key: SCRAPER_MAX_RETRIES
        value: "3"
